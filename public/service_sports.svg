<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6C8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)" rx="12"/>
  <circle cx="200" cy="120" r="70" fill="url(#glow4)"/>
  <!-- Runner/athlete in motion -->
  <circle cx="185" cy="85" r="16" fill="#B8860B" opacity="0.75"/>
  <!-- Body leaning forward -->
  <line x1="185" y1="101" x2="195" y2="150" stroke="#B8860B" stroke-width="3" opacity="0.65"/>
  <!-- Front leg (extended) -->
  <path d="M195 150 L220 175 L235 170" stroke="#B8860B" stroke-width="2.5" fill="none" opacity="0.55"/>
  <!-- Back leg (bent) -->
  <path d="M195 150 L175 175 L165 170" stroke="#B8860B" stroke-width="2.5" fill="none" opacity="0.55"/>
  <!-- Arms in running pose -->
  <line x1="188" y1="115" x2="165" y2="135" stroke="#B8860B" stroke-width="2" opacity="0.5"/>
  <line x1="188" y1="115" x2="210" y2="105" stroke="#B8860B" stroke-width="2" opacity="0.5"/>
  <!-- Motion lines -->
  <g opacity="0.2">
    <line x1="155" y1="80" x2="140" y2="80" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="158" y1="95" x2="138" y2="95" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="155" y1="110" x2="142" y2="110" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="160" y1="125" x2="145" y2="125" stroke="#B8860B" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
  <!-- Focus/star above head -->
  <g transform="translate(200, 55)" opacity="0.4">
    <polygon points="0,-8 2,-3 7,-3 3,1 5,7 0,3 -5,7 -3,1 -7,-3 -2,-3" fill="#D4A843"/>
  </g>
  <!-- Energy circle -->
  <circle cx="200" cy="130" r="55" stroke="#D4A843" stroke-width="0.8" fill="none" opacity="0.15" stroke-dasharray="6,4"/>
  <!-- Ground line -->
  <line x1="100" y1="178" x2="300" y2="178" stroke="#B8860B" stroke-width="0.8" opacity="0.15"/>
  <!-- Trophy silhouette -->
  <g transform="translate(300, 80)" opacity="0.2">
    <path d="M-10 0 L-8 -20 L8 -20 L10 0 Z" fill="#B8860B"/>
    <rect x="-4" y="0" width="8" height="8" fill="#B8860B"/>
    <rect x="-8" y="8" width="16" height="3" rx="1" fill="#B8860B"/>
  </g>
  <!-- Decorative -->
  <circle cx="110" cy="250" r="1.5" fill="#D4A843" opacity="0.2"/>
  <circle cx="290" cy="250" r="1.5" fill="#D4A843" opacity="0.2"/>
</svg>