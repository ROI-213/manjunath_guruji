<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E4D0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg5)" rx="12"/>
  <circle cx="200" cy="120" r="70" fill="url(#glow5)"/>
  <!-- Shield (protection) -->
  <path d="M200 55 L160 75 L160 130 Q160 170 200 190 Q240 170 240 130 L240 75 Z" fill="#B8860B" opacity="0.2" stroke="#B8860B" stroke-width="2" opacity="0.4"/>
  <!-- Inner shield -->
  <path d="M200 70 L172 85 L172 125 Q172 155 200 170 Q228 155 228 125 L228 85 Z" fill="#D4A843" opacity="0.15" stroke="#D4A843" stroke-width="1" opacity="0.3"/>
  <!-- Om/protection symbol -->
  <g transform="translate(200, 120)" opacity="0.5">
    <circle cx="0" cy="0" r="15" stroke="#B8860B" stroke-width="1.5" fill="none"/>
    <path d="M-5 -8 Q0 -12 5 -8 Q8 -4 5 0 Q0 6 -5 0 Q-8 -4 -5 -8Z" fill="#B8860B" opacity="0.4"/>
  </g>
  <!-- Diya lamps on sides -->
  <g transform="translate(130, 200)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="10" ry="3" fill="#B8860B"/>
    <path d="M-6 0 Q0 -8 6 0" fill="#D4A843"/>
    <ellipse cx="0" cy="-8" rx="2" ry="4" fill="#FFD700" opacity="0.8"/>
  </g>
  <g transform="translate(270, 200)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="10" ry="3" fill="#B8860B"/>
    <path d="M-6 0 Q0 -8 6 0" fill="#D4A843"/>
    <ellipse cx="0" cy="-8" rx="2" ry="4" fill="#FFD700" opacity="0.8"/>
  </g>
  <!-- Protective light rays -->
  <g opacity="0.12">
    <line x1="200" y1="55" x2="200" y2="30" stroke="#B8860B" stroke-width="1.5"/>
    <line x1="180" y1="60" x2="168" y2="40" stroke="#B8860B" stroke-width="1"/>
    <line x1="220" y1="60" x2="232" y2="40" stroke="#B8860B" stroke-width="1"/>
    <line x1="165" y1="80" x2="148" y2="68" stroke="#B8860B" stroke-width="0.8"/>
    <line x1="235" y1="80" x2="252" y2="68" stroke="#B8860B" stroke-width="0.8"/>
  </g>
  <!-- Broken conflict symbol (X marks fading) -->
  <g opacity="0.1">
    <line x1="100" y1="100" x2="120" y2="120" stroke="#8B4513" stroke-width="2"/>
    <line x1="120" y1="100" x2="100" y2="120" stroke="#8B4513" stroke-width="2"/>
    <line x1="280" y1="100" x2="300" y2="120" stroke="#8B4513" stroke-width="2"/>
    <line x1="300" y1="100" x2="280" y2="120" stroke="#8B4513" stroke-width="2"/>
  </g>
  <!-- Peace dove silhouette -->
  <g transform="translate(200, 240)" opacity="0.2">
    <path d="M0 0 Q-5 -8 -12 -5 Q-8 -2 -5 0 Q-2 -6 5 -8 Q8 -4 5 0 Q10 -3 15 -5 Q12 0 5 2 Q0 3 -5 2 Q-8 4 -12 5 Q-5 3 0 0Z" fill="#B8860B"/>
  </g>
</svg>