<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6C8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="35%" r="35%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)" rx="12"/>
  <circle cx="200" cy="100" r="70" fill="url(#glow3)"/>
  <!-- Podium/Leader stand -->
  <rect x="170" y="180" width="60" height="45" rx="4" fill="#B8860B" opacity="0.3"/>
  <rect x="160" y="225" width="80" height="8" rx="3" fill="#B8860B" opacity="0.4"/>
  <!-- Person at podium -->
  <circle cx="200" cy="120" r="20" fill="#B8860B" opacity="0.7"/>
  <path d="M178 148 Q200 170 222 148" stroke="#B8860B" stroke-width="2.5" fill="none" opacity="0.6"/>
  <line x1="200" y1="140" x2="200" y2="178" stroke="#B8860B" stroke-width="2.5" opacity="0.6"/>
  <!-- Arms raised (leadership) -->
  <line x1="200" y1="152" x2="178" y2="140" stroke="#B8860B" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="152" x2="222" y2="140" stroke="#B8860B" stroke-width="2" opacity="0.5"/>
  <!-- Lotus symbol (Indian politics) -->
  <g transform="translate(200, 75)" opacity="0.4">
    <path d="M0 0 Q-8 -12 0 -20 Q8 -12 0 0Z" fill="#B8860B"/>
    <path d="M0 0 Q-14 -8 -12 -18 Q-4 -14 0 0Z" fill="#D4A843" opacity="0.7"/>
    <path d="M0 0 Q14 -8 12 -18 Q4 -14 0 0Z" fill="#D4A843" opacity="0.7"/>
    <path d="M0 0 Q-18 -2 -20 -14 Q-10 -10 0 0Z" fill="#B8860B" opacity="0.5"/>
    <path d="M0 0 Q18 -2 20 -14 Q10 -10 0 0Z" fill="#B8860B" opacity="0.5"/>
  </g>
  <!-- Audience silhouettes -->
  <g opacity="0.15">
    <circle cx="120" cy="260" r="8" fill="#8B6914"/>
    <circle cx="150" cy="258" r="7" fill="#8B6914"/>
    <circle cx="180" cy="262" r="8" fill="#8B6914"/>
    <circle cx="220" cy="262" r="8" fill="#8B6914"/>
    <circle cx="250" cy="258" r="7" fill="#8B6914"/>
    <circle cx="280" cy="260" r="8" fill="#8B6914"/>
  </g>
  <!-- Confidence rays -->
  <g opacity="0.15">
    <line x1="200" y1="95" x2="170" y2="60" stroke="#B8860B" stroke-width="1"/>
    <line x1="200" y1="95" x2="200" y2="55" stroke="#B8860B" stroke-width="1.2"/>
    <line x1="200" y1="95" x2="230" y2="60" stroke="#B8860B" stroke-width="1"/>
    <line x1="200" y1="95" x2="155" y2="70" stroke="#B8860B" stroke-width="0.8"/>
    <line x1="200" y1="95" x2="245" y2="70" stroke="#B8860B" stroke-width="0.8"/>
  </g>
  <!-- Decorative -->
  <circle cx="100" cy="100" r="2" fill="#D4A843" opacity="0.2"/>
  <circle cx="300" cy="110" r="1.5" fill="#D4A843" opacity="0.2"/>
</svg>